name: Playwright test
on:
  push:
    branches: [ my-full-featured ]
  pull-request:
    branches: [ my-full-featured ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm install
    - run: npx playwright install --with-deps chromium
    - run: npm test

